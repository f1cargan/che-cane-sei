<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Che cane sei?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap');

  :root {
    --cream: #F7F3EC;
    --bark: #5C3D2E;
    --moss: #4A5E40;
    --amber: #C8873A;
    --paw: #E8D5C0;
    --text: #2A1F1A;
    --muted: #8A7468;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }

  /* HERO */
  #screen-intro {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    background: var(--bark);
    color: var(--cream);
    position: relative;
    overflow: hidden;
  }

  #screen-intro::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: rgba(200,135,58,0.12);
    top: -200px; right: -200px;
  }

  #screen-intro::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(200,135,58,0.08);
    bottom: -150px; left: -100px;
  }

  .paw-icon {
    font-size: 64px;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(42px, 8vw, 80px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
    position: relative;
    z-index: 1;
    margin-bottom: 8px;
  }

  .hero-sub {
    font-family: 'Playfair Display', serif;
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 700;
    color: var(--amber);
    letter-spacing: 2px;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
    margin-bottom: 32px;
  }

  .hero-desc {
    max-width: 480px;
    font-size: 16px;
    line-height: 1.7;
    color: rgba(247,243,236,0.75);
    position: relative;
    z-index: 1;
    margin-bottom: 48px;
  }

  .btn-start {
    background: var(--amber);
    color: white;
    border: none;
    padding: 18px 48px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    z-index: 1;
    transition: transform 0.2s, background 0.2s;
  }

  .btn-start:hover {
    background: #d4953f;
    transform: translateY(-2px);
  }

  .disclaimer {
    position: relative;
    z-index: 1;
    margin-top: 24px;
    font-size: 12px;
    color: rgba(247,243,236,0.4);
  }

  /* QUIZ */
  #screen-quiz {
    display: none;
    min-height: 100vh;
    padding: 40px 24px;
    max-width: 680px;
    margin: 0 auto;
  }

  .progress-wrap {
    margin-bottom: 48px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .progress-bar {
    height: 3px;
    background: var(--paw);
    border-radius: 2px;
  }

  .progress-fill {
    height: 100%;
    background: var(--amber);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .question-number {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 16px;
  }

  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 700;
    line-height: 1.3;
    color: var(--bark);
    margin-bottom: 40px;
  }

  .options-grid {
    display: grid;
    gap: 12px;
  }

  .option-btn {
    background: white;
    border: 2px solid var(--paw);
    padding: 20px 24px;
    text-align: left;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    transition: all 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .option-btn:hover {
    border-color: var(--amber);
    background: #fdf9f4;
    transform: translateX(4px);
  }

  .option-btn.selected {
    border-color: var(--bark);
    background: var(--bark);
    color: var(--cream);
  }

  .option-letter {
    font-weight: 700;
    font-size: 13px;
    color: var(--amber);
    min-width: 20px;
    margin-top: 1px;
  }

  .option-btn.selected .option-letter {
    color: var(--amber);
  }

  .btn-next {
    margin-top: 32px;
    background: var(--bark);
    color: var(--cream);
    border: none;
    padding: 16px 40px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0;
    pointer-events: none;
  }

  .btn-next.visible {
    opacity: 1;
    pointer-events: all;
  }

  .btn-next:hover {
    background: var(--amber);
    transform: translateY(-2px);
  }

  /* RESULT */
  #screen-result {
    display: none;
    min-height: 100vh;
  }

  .result-hero {
    background: var(--bark);
    color: var(--cream);
    padding: 60px 24px 40px;
    text-align: center;
  }

  .result-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 16px;
  }

  .result-sei {
    font-family: 'Playfair Display', serif;
    font-size: clamp(14px, 3vw, 18px);
    font-weight: 700;
    color: rgba(247,243,236,0.6);
    margin-bottom: 8px;
  }

  .result-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(48px, 10vw, 88px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -3px;
    margin-bottom: 16px;
  }

  .result-archetype {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 40px;
  }

  .result-image-wrap {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    margin: 0 auto;
    overflow: hidden;
    border: 4px solid var(--amber);
    background: var(--paw);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
  }

  .result-image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .result-body {
    max-width: 600px;
    margin: 0 auto;
    padding: 48px 24px 60px;
  }

  .result-desc {
    font-size: 18px;
    line-height: 1.8;
    color: var(--text);
    margin-bottom: 48px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
  }

  .result-traits {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 48px;
  }

  .trait {
    background: white;
    border-left: 3px solid var(--amber);
    padding: 16px 20px;
  }

  .trait-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .trait-bar-wrap {
    height: 4px;
    background: var(--paw);
    border-radius: 2px;
  }

  .trait-bar {
    height: 100%;
    background: var(--amber);
    border-radius: 2px;
  }

  .btn-share {
    display: block;
    width: 100%;
    background: #1877F2;
    color: white;
    border: none;
    padding: 18px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    transition: background 0.2s;
  }

  .btn-share:hover { background: #1565d8; }

  .btn-retry {
    display: block;
    width: 100%;
    background: transparent;
    color: var(--bark);
    border: 2px solid var(--bark);
    padding: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .btn-retry:hover {
    background: var(--bark);
    color: var(--cream);
  }

  @media (max-width: 480px) {
    .result-traits { grid-template-columns: 1fr; }
    .result-name { letter-spacing: -1px; }
  }
</style>
</head>
<body>

<!-- INTRO -->
<div id="screen-intro">
  <div class="paw-icon">🐾</div>
  <div class="hero-title">Che cane sei?</div>
  <div class="hero-sub">Il quiz del carattere</div>
  <p class="hero-desc">Sette domande. Nessuna risposta giusta o sbagliata. Solo te — con le orecchie giuste e il pelo adatto.</p>
  <button class="btn-start" onclick="startQuiz()">Scoprilo adesso</button>
  <p class="disclaimer">Gratuito · Nessuna email richiesta · Solo divertimento</p>
</div>

<!-- QUIZ -->
<div id="screen-quiz">
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progress-text">Domanda 1 di 7</span>
      <span id="progress-pct">14%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:14%"></div></div>
  </div>
  <div class="question-number" id="q-number">01 / 07</div>
  <div class="question-text" id="q-text"></div>
  <div class="options-grid" id="q-options"></div>
  <button class="btn-next" id="btn-next" onclick="nextQuestion()">Avanti →</button>
</div>

<!-- RESULT -->
<div id="screen-result">
  <div class="result-hero">
    <div class="result-label">Il tuo risultato</div>
    <div class="result-sei">Sei</div>
    <div class="result-name" id="r-name"></div>
    <div class="result-archetype" id="r-archetype"></div>
    <div class="result-image-wrap" id="r-image"></div>
  </div>
  <div class="result-body">
    <p class="result-desc" id="r-desc"></p>
    <div class="result-traits" id="r-traits"></div>
    <button class="btn-share" onclick="shareOnFacebook()">Condividi su Facebook</button>
    <button class="btn-retry" onclick="resetQuiz()">Rifai il quiz</button>
  </div>
</div>

<script>
const questions = [
  {
    text: "Come ti comporti a una festa con persone che non conosci?",
    options: [
      { text: "Mi lancio, conosco tutti nel giro di mezz'ora.", scores: { S: 4, E: 0, St: 0, F: 0 } },
      { text: "Mi aggrego a un gruppetto e sto lì tutta la sera.", scores: { S: 3, E: 0, St: 0, F: 0 } },
      { text: "Osservo, scelgo con chi parlare — poche conversazioni ma vere.", scores: { S: 2, E: 0, St: 0, F: 0 } },
      { text: "Preferivo non venire, ma dato che sono qui sopravvivo.", scores: { S: 1, E: 0, St: 0, F: 0 } }
    ]
  },
  {
    text: "Come descriveresti il tuo ritmo quotidiano?",
    options: [
      { text: "Sempre in movimento, mi fermo solo quando crollo.", scores: { S: 0, E: 4, St: 0, F: 0 } },
      { text: "Attivo ma con i miei tempi, ho bisogno di scaricare.", scores: { S: 0, E: 3, St: 0, F: 0 } },
      { text: "Alterno momenti intensi a pause lunghe.", scores: { S: 0, E: 2, St: 0, F: 0 } },
      { text: "Preferisco la lentezza — agisco poco ma bene.", scores: { S: 0, E: 1, St: 0, F: 0 } }
    ]
  },
  {
    text: "Come ti rapporti alle regole?",
    options: [
      { text: "Le regole esistono per un motivo, le rispetto e basta.", scores: { S: 0, E: 0, St: 4, F: 0 } },
      { text: "Le seguo se le trovo ragionevoli.", scores: { S: 0, E: 0, St: 3, F: 0 } },
      { text: "Mi adatto, ma non sono il mio punto di riferimento.", scores: { S: 0, E: 0, St: 2, F: 0 } },
      { text: "Le regole sono gabbie — trovo sempre la mia strada.", scores: { S: 0, E: 0, St: 1, F: 0 } }
    ]
  },
  {
    text: "Quando qualcuno che ami è in difficoltà, cosa fai?",
    options: [
      { text: "Lo abbraccio, lo ascolto, mi metto da parte.", scores: { S: 0, E: 0, St: 0, F: 1 } },
      { text: "Cerco una soluzione pratica, non solo conforto.", scores: { S: 0, E: 0, St: 0, F: 2 } },
      { text: "Lo proteggo, anche fisicamente se serve.", scores: { S: 0, E: 0, St: 0, F: 3 } },
      { text: "Intervengo deciso, non aspetto che peggiori.", scores: { S: 0, E: 0, St: 0, F: 4 } }
    ]
  },
  {
    text: "Cosa ti dà più soddisfazione?",
    options: [
      { text: "Vedere gli altri felici grazie a me.", scores: { S: 4, E: 0, St: 0, F: 1 } },
      { text: "Risolvere un problema complicato.", scores: { S: 0, E: 4, St: 4, F: 0 } },
      { text: "Fare qualcosa di inaspettato che nessuno si aspettava.", scores: { S: 2, E: 3, St: 1, F: 0 } },
      { text: "Proteggere qualcosa o qualcuno di importante.", scores: { S: 0, E: 0, St: 3, F: 4 } }
    ]
  },
  {
    text: "Come reagisci a una provocazione?",
    options: [
      { text: "Rispondo subito, non ci penso due volte.", scores: { S: 0, E: 4, St: 0, F: 3 } },
      { text: "Incasso, poi trovo il modo di sistemare le cose a modo mio.", scores: { S: 0, E: 2, St: 1, F: 0 } },
      { text: "Valuto, intervengo solo se necessario — con precisione.", scores: { S: 0, E: 0, St: 3, F: 4 } },
      { text: "Cerco di disinnescare, non mi piace il conflitto.", scores: { S: 3, E: 0, St: 0, F: 1 } }
    ]
  },
  {
    text: "Qual è la cosa che ti descrive meglio?",
    options: [
      { text: "La fedeltà — ci sono sempre, qualunque cosa succeda.", scores: { S: 3, E: 0, St: 3, F: 2 } },
      { text: "La libertà — non appartengo a nessuno e a tutti.", scores: { S: 2, E: 3, St: 1, F: 0 } },
      { text: "L'intelligenza — capisco prima degli altri.", scores: { S: 2, E: 3, St: 2, F: 0 } },
      { text: "La forza — non fisica, nel senso di presenza.", scores: { S: 1, E: 0, St: 3, F: 4 } }
    ]
  }
];

const breeds = [
  {
    name: "Golden Retriever",
    archetype: "L'empatico universale",
    emoji: "🐕",
    desc: "Calore, generosità, presenza rassicurante. Tutti ti vogliono bene e tu non riesci a voler male a nessuno. A volte ti sfruttano, ma non smetti di fidarti.",
    profile: { S: 4, E: 2, St: 2, F: 1 }
  },
  {
    name: "Border Collie",
    archetype: "Il perfezionista instancabile",
    emoji: "🐩",
    desc: "Mente sempre in moto, devi risolvere problemi, organizzi tutto. Sei il più capace della stanza ma puoi diventare ansioso se non hai uno scopo.",
    profile: { S: 3, E: 4, St: 4, F: 2 }
  },
  {
    name: "Bassotto",
    archetype: "Il testardo curioso",
    emoji: "🐶",
    desc: "Piccolo ma convinto di essere enorme. Non molli mai un'idea, scavi finché non arrivi in fondo. Irresistibile anche quando sei scomodo.",
    profile: { S: 3, E: 3, St: 1, F: 2 }
  },
  {
    name: "Akita",
    archetype: "Il leale riservato",
    emoji: "🐕‍🦺",
    desc: "Pochi amici ma per sempre. Non ti apri facilmente, ma chi guadagna la tua fiducia ha un alleato incondizionato. Gli estranei ti trovano freddo, i tuoi ti adorano.",
    profile: { S: 1, E: 1, St: 4, F: 4 }
  },
  {
    name: "Beagle",
    archetype: "Il curioso sociale",
    emoji: "🐕",
    desc: "Annusi tutto, esplori tutto, conosci tutti. La vita come avventura continua. Difficile farti stare fermo, impossibile farti smettere di sorridere.",
    profile: { S: 4, E: 2, St: 1, F: 1 }
  },
  {
    name: "Siberian Husky",
    archetype: "Il libero spirito drammatico",
    emoji: "🐺",
    desc: "Bellissimo, carismatico, un po' inaffidabile. Ami la libertà più di qualsiasi legame. Quando vuoi sei straordinario, ma sparisci quando ti senti in gabbia.",
    profile: { S: 2, E: 3, St: 1, F: 2 }
  },
  {
    name: "Pastore Tedesco",
    archetype: "Il responsabile protettivo",
    emoji: "🐕‍🦺",
    desc: "Senso del dovere fortissimo. Ti prendi cura degli altri, spesso a spese tue. Leale fino in fondo — ti fidi delle regole, ma solo se le trovi giuste.",
    profile: { S: 2, E: 3, St: 4, F: 4 }
  },
  {
    name: "Chihuahua",
    archetype: "L'intenso senza filtri",
    emoji: "🐕",
    desc: "Personalità enorme in formato compatto. Dici quello che pensi, non ti intimidisce nessuno. Selettivo negli affetti — ma quando ami, ami in modo totale.",
    profile: { S: 2, E: 4, St: 2, F: 3 }
  },
  {
    name: "Labrador",
    archetype: "L'ottimista contagioso",
    emoji: "🦮",
    desc: "Ogni giorno è il migliore della tua vita. Entusiasmo genuino, nessuna malizia, amico di chiunque. A volte ingenuo, sempre autentico.",
    profile: { S: 4, E: 3, St: 2, F: 1 }
  },
  {
    name: "San Bernardo",
    archetype: "Il saggio paziente",
    emoji: "🐕",
    desc: "Presenza solida, rassicurante. Le persone vengono da te nei momenti difficili. Non cerchi i riflettori — ma quando parli, tutti ascoltano.",
    profile: { S: 3, E: 1, St: 2, F: 3 }
  },
  {
    name: "Jack Russell",
    archetype: "L'energia pura",
    emoji: "🐕",
    desc: "Veloce, imprevedibile, sempre in movimento. Ti annoi facilmente, hai bisogno di stimoli continui. Trascinante e un po' esaurente — ma non vorresti essere diverso.",
    profile: { S: 3, E: 4, St: 1, F: 2 }
  },
  {
    name: "Cane Corso",
    archetype: "Il silenzioso determinato",
    emoji: "🐕‍🦺",
    desc: "Non hai bisogno di dimostrare niente. La tua forza è evidente senza che tu la mostri. Poche parole, decisioni chiare, presenza che si sente.",
    profile: { S: 1, E: 2, St: 3, F: 4 }
  },
  {
    name: "Lupo",
    archetype: "Il solitario istintivo",
    emoji: "🐺",
    desc: "Non sei stato addomesticato del tutto e non hai intenzione di esserlo. Guidi senza cercarlo, ispiri rispetto senza chiederlo. Il branco ti segue — quando decidi di averne uno.",
    profile: { S: 1, E: 3, St: 1, F: 4 }
  },
  {
    name: "Volpe",
    archetype: "L'intelligenza laterale",
    emoji: "🦊",
    desc: "Vedi quello che gli altri non vedono. Arrivi dove vuoi senza che nessuno capisca come. Non è furbizia — è una forma di intelligenza che la maggior parte delle persone non sa nemmeno nominare.",
    profile: { S: 2, E: 3, St: 2, F: 3 }
  }
];

let currentQ = 0;
let totalScores = { S: 0, E: 0, St: 0, F: 0 };
let selectedOption = null;

function startQuiz() {
  document.getElementById('screen-intro').style.display = 'none';
  document.getElementById('screen-quiz').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  const letters = ['A', 'B', 'C', 'D'];
  const pct = Math.round(((currentQ + 1) / questions.length) * 100);

  document.getElementById('progress-text').textContent = `Domanda ${currentQ + 1} di ${questions.length}`;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-number').textContent = String(currentQ + 1).padStart(2, '0') + ' / 07';
  document.getElementById('q-text').textContent = q.text;

  const container = document.getElementById('q-options');
  container.innerHTML = '';
  selectedOption = null;
  document.getElementById('btn-next').classList.remove('visible');

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${letters[i]}</span><span>${opt.text}</span>`;
    btn.onclick = () => selectOption(i, btn);
    container.appendChild(btn);
  });
}

function selectOption(index, btn) {
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedOption = index;
  document.getElementById('btn-next').classList.add('visible');
}

function nextQuestion() {
  if (selectedOption === null) return;

  const scores = questions[currentQ].options[selectedOption].scores;
  Object.keys(scores).forEach(k => totalScores[k] += scores[k]);

  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('screen-quiz').style.display = 'none';
  document.getElementById('screen-result').style.display = 'block';

  const result = computeResult();

  document.getElementById('r-name').textContent = result.name;
  document.getElementById('r-archetype').textContent = result.archetype;
  document.getElementById('r-desc').textContent = result.desc;

  const imgWrap = document.getElementById('r-image');
  imgWrap.innerHTML = result.emoji;
  imgWrap.style.fontSize = '80px';
  imgWrap.style.lineHeight = '200px';
  imgWrap.style.textAlign = 'center';

  const axes = [
    { label: 'Socialità', key: 'S' },
    { label: 'Energia', key: 'E' },
    { label: 'Struttura', key: 'St' },
    { label: 'Determinazione', key: 'F' }
  ];

  const traitsEl = document.getElementById('r-traits');
  traitsEl.innerHTML = '';
  axes.forEach(ax => {
    const pct = Math.round((result.profile[ax.key] / 4) * 100);
    traitsEl.innerHTML += `
      <div class="trait">
        <div class="trait-label">${ax.label}</div>
        <div class="trait-bar-wrap"><div class="trait-bar" style="width:${pct}%"></div></div>
      </div>`;
  });

  window.scrollTo(0, 0);
}

function computeResult() {
  // Normalizza i punteggi su scala 1-4 (stessa scala dei profili)
  // Ogni asse ha massimo 4 punti da una domanda diretta + contributi parziali
  // Calcoliamo il massimo teorico per normalizzare
  const maxS = 4, maxE = 4, maxSt = 4, maxF = 4;

  const normS  = Math.min(totalScores.S  / maxS,  1);
  const normE  = Math.min(totalScores.E  / maxE,  1);
  const normSt = Math.min(totalScores.St / maxSt, 1);
  const normF  = Math.min(totalScores.F  / maxF,  1);

  let best = null;
  let bestDist = Infinity;

  breeds.forEach(breed => {
    const bS  = (breed.profile.S  - 1) / 3;
    const bE  = (breed.profile.E  - 1) / 3;
    const bSt = (breed.profile.St - 1) / 3;
    const bF  = (breed.profile.F  - 1) / 3;

    // Distanza euclidea su 4 dimensioni normalizzate
    const dist = Math.sqrt(
      Math.pow(normS  - bS,  2) +
      Math.pow(normE  - bE,  2) +
      Math.pow(normSt - bSt, 2) +
      Math.pow(normF  - bF,  2)
    );

    if (dist < bestDist) {
      bestDist = dist;
      best = breed;
    }
  });

  return best;
}

function shareOnFacebook() {
  const name = document.getElementById('r-name').textContent;
  const text = encodeURIComponent(`Ho fatto il quiz "Che cane sei?" e sono: ${name}! Scopri anche tu 🐾`);
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}&quote=${text}`, '_blank');
}

function resetQuiz() {
  currentQ = 0;
  totalScores = { S: 0, E: 0, St: 0, F: 0 };
  selectedOption = null;
  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('screen-intro').style.display = 'flex';
  window.scrollTo(0, 0);
}
