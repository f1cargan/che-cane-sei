<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Che persona è il tuo cane?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap');

  :root {
    --cream: #F7F3EC;
    --bark: #3D5A47;
    --moss: #4A5E40;
    --amber: #C8873A;
    --paw: #D8E8DC;
    --text: #1A2A1F;
    --muted: #6A8470;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }

  /* HERO */
  #screen-intro {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    background: var(--bark);
    color: var(--cream);
    position: relative;
    overflow: hidden;
  }

  #screen-intro::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: rgba(200,135,58,0.12);
    top: -200px; right: -200px;
  }

  #screen-intro::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(200,135,58,0.08);
    bottom: -150px; left: -100px;
  }

  .paw-icon {
    font-size: 64px;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(32px, 7vw, 68px);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -2px;
    position: relative;
    z-index: 1;
    margin-bottom: 8px;
  }

  .hero-sub {
    font-family: 'Playfair Display', serif;
    font-size: clamp(14px, 3vw, 20px);
    font-weight: 700;
    color: var(--amber);
    letter-spacing: 2px;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
    margin-bottom: 32px;
  }

  .hero-desc {
    max-width: 480px;
    font-size: 16px;
    line-height: 1.7;
    color: rgba(247,243,236,0.75);
    position: relative;
    z-index: 1;
    margin-bottom: 48px;
  }

  .btn-start {
    background: var(--amber);
    color: white;
    border: none;
    padding: 18px 48px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    z-index: 1;
    transition: transform 0.2s, background 0.2s;
  }

  .btn-start:hover {
    background: #d4953f;
    transform: translateY(-2px);
  }

  .disclaimer {
    position: relative;
    z-index: 1;
    margin-top: 24px;
    font-size: 12px;
    color: rgba(247,243,236,0.4);
  }

  /* GENDER SCREEN */
  #screen-gender {
    display: none;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 40px 24px;
    text-align: center;
    background: var(--cream);
  }

  .gender-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(26px, 5vw, 42px);
    font-weight: 700;
    color: var(--bark);
    margin-bottom: 12px;
  }

  .gender-sub {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 48px;
  }

  .gender-btns {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .gender-btn {
    background: white;
    border: 2px solid var(--paw);
    padding: 32px 48px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    min-width: 160px;
  }

  .gender-btn:hover {
    border-color: var(--amber);
    background: #fdf9f4;
    transform: translateY(-3px);
  }

  .gender-emoji { font-size: 48px; }

  /* QUIZ */
  #screen-quiz {
    display: none;
    min-height: 100vh;
    padding: 40px 24px;
    max-width: 680px;
    margin: 0 auto;
  }

  .progress-wrap { margin-bottom: 48px; }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .progress-bar {
    height: 3px;
    background: var(--paw);
    border-radius: 2px;
  }

  .progress-fill {
    height: 100%;
    background: var(--amber);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .question-number {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 16px;
  }

  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 700;
    line-height: 1.3;
    color: var(--bark);
    margin-bottom: 40px;
  }

  .options-grid { display: grid; gap: 12px; }

  .option-btn {
    background: white;
    border: 2px solid var(--paw);
    padding: 20px 24px;
    text-align: left;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    transition: all 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .option-btn:hover {
    border-color: var(--amber);
    background: #fdf9f4;
    transform: translateX(4px);
  }

  .option-btn.selected {
    border-color: var(--bark);
    background: var(--bark);
    color: var(--cream);
  }

  .option-letter {
    font-weight: 700;
    font-size: 13px;
    color: var(--amber);
    min-width: 20px;
    margin-top: 1px;
  }

  .btn-next {
    margin-top: 32px;
    background: var(--bark);
    color: var(--cream);
    border: none;
    padding: 16px 40px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0;
    pointer-events: none;
  }

  .btn-next.visible {
    opacity: 1;
    pointer-events: all;
  }

  .btn-next:hover {
    background: var(--amber);
    transform: translateY(-2px);
  }

  /* RESULT */
  #screen-result { display: none; min-height: 100vh; }

  .result-hero {
    background: var(--bark);
    color: var(--cream);
    padding: 60px 24px 40px;
    text-align: center;
  }

  .result-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 16px;
  }

  .result-sei {
    font-family: 'Playfair Display', serif;
    font-size: clamp(14px, 3vw, 18px);
    font-weight: 700;
    color: rgba(247,243,236,0.6);
    margin-bottom: 8px;
  }

  .result-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(40px, 9vw, 80px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -3px;
    margin-bottom: 16px;
  }

  .result-archetype {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 40px;
  }

  .result-image-wrap {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    margin: 0 auto;
    border: 4px solid var(--amber);
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    line-height: 1;
  }

  .result-body {
    max-width: 600px;
    margin: 0 auto;
    padding: 48px 24px 60px;
  }

  .result-desc {
    font-size: 18px;
    line-height: 1.8;
    color: var(--text);
    margin-bottom: 48px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
  }

  .result-traits {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 48px;
  }

  .trait {
    background: white;
    border-left: 3px solid var(--amber);
    padding: 16px 20px;
  }

  .trait-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .trait-bar-wrap {
    height: 4px;
    background: var(--paw);
    border-radius: 2px;
  }

  .trait-bar {
    height: 100%;
    background: var(--amber);
    border-radius: 2px;
  }

  .btn-share {
    display: block;
    width: 100%;
    background: #1877F2;
    color: white;
    border: none;
    padding: 18px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    transition: background 0.2s;
  }

  .btn-share:hover { background: #1565d8; }

  .btn-retry {
    display: block;
    width: 100%;
    background: transparent;
    color: var(--bark);
    border: 2px solid var(--bark);
    padding: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
    margin-bottom: 12px;
  }

  .btn-retry:hover {
    background: var(--bark);
    color: var(--cream);
  }

  .btn-other-quiz {
    display: block;
    width: 100%;
    background: transparent;
    color: var(--amber);
    border: 2px solid var(--amber);
    padding: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .btn-other-quiz:hover {
    background: var(--amber);
    color: white;
  }

  @media (max-width: 480px) {
    .result-traits { grid-template-columns: 1fr; }
    .result-name { letter-spacing: -1px; }
    .gender-btns { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>

<!-- INTRO -->
<div id="screen-intro">
  <div class="paw-icon">🐾</div>
  <div class="hero-title">Che persona è il tuo cane?</div>
  <div class="hero-sub">Il quiz del carattere capovolto</div>
  <p class="hero-desc">Sette domande sul tuo cane. Scopri che tipo umano si nasconde sotto quel pelo.</p>
  <button class="btn-start" onclick="startGender()">Inizia adesso</button>
  <p class="disclaimer">Gratuito · Nessuna email richiesta · Solo divertimento</p>
</div>

<!-- GENDER -->
<div id="screen-gender">
  <div class="gender-title">Prima di tutto —</div>
  <div class="gender-sub">Il tuo cane è maschio o femmina?</div>
  <div class="gender-btns">
    <button class="gender-btn" onclick="setGender('m')">
      <span class="gender-emoji">🐕</span>
      <span>Maschio</span>
    </button>
    <button class="gender-btn" onclick="setGender('f')">
      <span class="gender-emoji">🐩</span>
      <span>Femmina</span>
    </button>
  </div>
</div>

<!-- QUIZ -->
<div id="screen-quiz">
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progress-text">Domanda 1 di 7</span>
      <span id="progress-pct">14%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:14%"></div></div>
  </div>
  <div class="question-number" id="q-number">01 / 07</div>
  <div class="question-text" id="q-text"></div>
  <div class="options-grid" id="q-options"></div>
  <button class="btn-next" id="btn-next" onclick="nextQuestion()">Avanti →</button>
</div>

<!-- RESULT -->
<div id="screen-result">
  <div class="result-hero">
    <div class="result-label">Il tuo cane è</div>
    <div class="result-sei" id="r-sei"></div>
    <div class="result-name" id="r-name"></div>
    <div class="result-archetype" id="r-archetype"></div>
    <div class="result-image-wrap" id="r-image"></div>
  </div>
  <div class="result-body">
    <p class="result-desc" id="r-desc"></p>
    <div class="result-traits" id="r-traits"></div>
    <button class="btn-share" onclick="shareOnFacebook()">Condividi su Facebook</button>
    <button class="btn-retry" onclick="resetQuiz()">Rifai il quiz</button>
    <button class="btn-other-quiz" onclick="goToOtherQuiz()">Scopri anche che cane sei tu →</button>
  </div>
</div>

function startGender() {
  document.getElementById('screen-intro').style.display = 'none';
  document.getElementById('screen-gender').style.display = 'flex';
}

function setGender(g) {
  dogGender = g;
  document.getElementById('screen-gender').style.display = 'none';
  document.getElementById('screen-quiz').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  const letters = ['A', 'B', 'C', 'D'];
  const pct = Math.round(((currentQ + 1) / questions.length) * 100);

  document.getElementById('progress-text').textContent = `Domanda ${currentQ + 1} di ${questions.length}`;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-number').textContent = String(currentQ + 1).padStart(2, '0') + ' / 07';
  document.getElementById('q-text').textContent = q.text;

  const container = document.getElementById('q-options');
  container.innerHTML = '';
  selectedOption = null;
  document.getElementById('btn-next').classList.remove('visible');

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${letters[i]}</span><span>${opt.text}</span>`;
    btn.onclick = () => selectOption(i, btn);
    container.appendChild(btn);
  });
}

function selectOption(index, btn) {
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedOption = index;
  document.getElementById('btn-next').classList.add('visible');
}

function nextQuestion() {
  if (selectedOption === null) return;
  const scores = questions[currentQ].options[selectedOption].scores;
  Object.keys(scores).forEach(k => totalScores[k] += scores[k]);
  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('screen-quiz').style.display = 'none';
  document.getElementById('screen-result').style.display = 'block';

  const result = computeResult();
  const isFem = dogGender === 'f';

  document.getElementById('r-sei').textContent = isFem ? 'una vera' : 'un vero';
  document.getElementById('r-name').textContent = isFem ? result.nameF : result.nameM;
  document.getElementById('r-archetype').textContent = isFem ? result.archF : result.archM;
  document.getElementById('r-desc').textContent = isFem ? result.descF : result.descM;

  const imgWrap = document.getElementById('r-image');
  imgWrap.textContent = result.emoji;

  const axes = [
    { label: 'Socialità', key: 'S' },
    { label: 'Energia', key: 'E' },
    { label: 'Struttura', key: 'St' },
    { label: 'Determinazione', key: 'F' }
  ];

  const traitsEl = document.getElementById('r-traits');
  traitsEl.innerHTML = '';
  axes.forEach(ax => {
    const pct = Math.round((result.profile[ax.key] / 4) * 100);
    traitsEl.innerHTML += `
      <div class="trait">
        <div class="trait-label">${ax.label}</div>
        <div class="trait-bar-wrap"><div class="trait-bar" style="width:${pct}%"></div></div>
      </div>`;
  });

  window.scrollTo(0, 0);
}

function computeResult() {
  // Normalizza i punteggi su [0,1] — ogni asse va da 0 a ~4
  // I profili sono su scala 1-4: normalizziamo entrambi su [0,1]
  const normS  = Math.min(totalScores.S  / 4, 1);
  const normE  = Math.min(totalScores.E  / 4, 1);
  const normSt = Math.min(totalScores.St / 4, 1);
  const normF  = Math.min(totalScores.F  / 4, 1);

  let best = null;
  let bestDist = Infinity;

  archetypes.forEach(a => {
    const bS  = (a.profile.S  - 1) / 3;
    const bE  = (a.profile.E  - 1) / 3;
    const bSt = (a.profile.St - 1) / 3;
    const bF  = (a.profile.F  - 1) / 3;

    // Distanza euclidea su 4 dimensioni normalizzate
    const dist = Math.sqrt(
      Math.pow(normS  - bS,  2) +
      Math.pow(normE  - bE,  2) +
      Math.pow(normSt - bSt, 2) +
      Math.pow(normF  - bF,  2)
    );

    if (dist < bestDist) {
      bestDist = dist;
      best = a;
    }
  });

  return best;
}

function shareOnFacebook() {
  const isFem = dogGender === 'f';
  const name = isFem
    ? document.getElementById('r-name').textContent
    : document.getElementById('r-name').textContent;
  const text = encodeURIComponent(`Ho fatto il quiz "Che persona è il tuo cane?" — il mio è ${name}! Scopri anche tu 🐾`);
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}&quote=${text}`, '_blank');
}

function resetQuiz() {
  currentQ = 0;
  totalScores = { S: 0, E: 0, St: 0, F: 0 };
  selectedOption = null;
  dogGender = 'm';
  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('screen-intro').style.display = 'flex';
  window.scrollTo(0, 0);
}
